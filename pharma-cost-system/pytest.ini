[pytest]
# 项目根即工作目录：保证 `python -m pytest` 能 import 到 app 包（app/__init__.py 会把 vendor/ 加入 sys.path）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: 较慢的测试（报告生成/Word 渲染，约 3-10 秒）
filterwarnings =
    ignore::DeprecationWarning
